{# tabela usada nas páginas de limites e de resumo #}
{% if limites %}
  <div class="tabela">
    <table>
      <tr><th>Categoria</th><th class="numero">Gasto</th><th class="numero">Limite</th><th>Uso</th></tr>
      {% for limite in limites %}
        <tr>
          <td>{{ limite.nome }}</td>
          <td class="numero">{{ limite.gasto | reais }}</td>
          <td class="numero">{{ limite.limite | reais }}</td>
          <td class="uso">
            <div class="barra"><div class="preenchido {{ limite.situacao }}" style="width: {{ [limite.porcentagem, 100] | min }}%"></div></div>
            <span class="porcentagem {{ limite.situacao }}">{{ limite.porcentagem }}%</span>
          </td>
        </tr>
      {% endfor %}
    </table>
  </div>
{% else %}
  <p class="vazio">Nenhum limite definido.</p>
{% endif %}
